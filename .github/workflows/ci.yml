name: CI

on:
  push:
    branches: [main, 'codex/r1-rc']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job has timeout-minutes: 30. A hung browser test once held a macOS runner for
# over 30 minutes, and GitHub's default limit is six hours.
jobs:
  quality:
    name: Quality and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra parallel --extra visual
      - name: Check formatting
        run: uv run ruff format --check src tests bench scripts examples
      - name: Lint
        run: uv run ruff check src tests bench scripts examples
      - name: Type-check
        run: uv run mypy src scripts
      - name: Validate schemas, documentation and frozen corpus
        run: uv run pytest -q tests/test_contracts.py tests/test_documentation.py tests/test_release_corpus.py
      - name: Enforce critical corpus freeze
        run: uv run testence corpus validate corpus/r1-correctness-v2.json --structure-only --json
      - name: Enforce scale and deterministic-output budgets
        run: uv run python bench/scale_profile.py --repeats 3 --check --output scale-profile.json
      - name: Save scale profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testence-${{ github.sha }}-scale-profile
          path: scale-profile.json
          if-no-files-found: error
      - name: Build reproducible wheel and sdist bytes
        run: uv run python scripts/reproducible_build.py --dist-dir dist --output dist/reproducible-build.json
      - name: Save immutable candidate distributions and build receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testence-${{ github.sha }}-candidate-distributions
          path: dist/*
          if-no-files-found: error

  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64). Intel macOS has no hosted runner here.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra parallel --extra visual
      - name: Install Chromium and system dependencies
        if: runner.os == 'Linux'
        run: uv run playwright install --with-deps chromium
      - name: Install Chromium
        if: runner.os != 'Linux'
        run: uv run playwright install chromium
      - name: Run test suite
        # Per-test timings make a platform slowdown diagnosable from the artifact
        # instead of from a second run.
        run: uv run pytest -q --durations=25 --junitxml=test-timings/junit.xml
      - name: Save per-test timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testence-${{ github.sha }}-timings-${{ matrix.os }}-py${{ matrix.python }}
          path: test-timings/junit.xml
          if-no-files-found: warn
      - name: Run the documented examples
        # `testpaths` covers tests/ only, so a broken example reached the published
        # quick start without any job failing. These are the commands the README
        # hands a new reader, so CI runs exactly them.
        run: uv run pytest examples -q --testence-headless

  minimum-dependencies:
    name: Minimum dependencies / ${{ matrix.os }} / Python 3.10
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The floors in support.json are declared for every supported platform, so they
        # are proven on every one, not only on Linux.
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Locate the floor environment interpreter
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "FLOOR_PY=.venv-min/Scripts/python.exe" >> "$GITHUB_ENV"
          else
            echo "FLOOR_PY=.venv-min/bin/python" >> "$GITHUB_ENV"
          fi
      - name: Install declared minimum dependencies
        run: |
          uv venv --python 3.10 .venv-min
          uv pip install --python "$FLOOR_PY" "jsonschema==4.23.0" "playwright==1.49.0" "pytest==8.0.0" "pytest-xdist==3.6.1" "spdx-tools==0.8.5" "pillow==12.1.1" .
      - name: Install minimum Playwright Chromium
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            "$FLOOR_PY" -m playwright install --with-deps chromium
          else
            "$FLOOR_PY" -m playwright install chromium
          fi
      - name: Run suite at dependency floor
        run: '"$FLOOR_PY" -m pytest -q'

  installed-wheel:
    name: Installed wheel / browser / release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality, tests, minimum-dependencies]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Download the immutable candidate distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: testence-${{ github.sha }}-candidate-distributions
          path: dist
      - name: Install wheel outside the checkout environment
        run: |
          uv venv .wheel-venv
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          uv pip install --python .wheel-venv/bin/python "$wheel"
          .wheel-venv/bin/python -m playwright install --with-deps chromium
      - name: Run isolated installed-wheel smoke
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          .wheel-venv/bin/python -I scripts/installed_wheel_smoke.py --distribution "$wheel" --output release-artifacts/installed-wheel-smoke.json
      - name: Rebuild the wheel from the exact sdist
        run: .wheel-venv/bin/python -I scripts/sdist_rebuild_smoke.py --dist-dir dist --output release-artifacts/sdist-rebuild.json
      - name: Generate installed dependency and license inventory
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          .wheel-venv/bin/python -I scripts/dependency_inventory.py --distribution "$wheel" --smoke-receipt release-artifacts/installed-wheel-smoke.json --output release-artifacts/dependency-inventory.json
      - name: Install pinned SPDX validator outside the runtime inventory
        run: uv pip install --python .wheel-venv/bin/python "spdx-tools==0.8.5"
      - name: Generate checksums, resolved SPDX SBOM and local provenance
        run: .wheel-venv/bin/python -I scripts/release_artifacts.py --dist-dir dist --output-dir release-artifacts --dependency-inventory release-artifacts/dependency-inventory.json --repository "${{ github.server_url }}/${{ github.repository }}" --revision "${{ github.sha }}"
      - name: Sign build provenance
        if: github.event_name != 'pull_request' && (!github.event.repository.private || vars.PRIVATE_ATTESTATIONS_ENABLED == 'true')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Record unavailable private-repository signing
        if: github.event.repository.private && vars.PRIVATE_ATTESTATIONS_ENABLED != 'true'
        run: echo 'Unsigned private engineering candidate. GitHub artifact attestations require Enterprise Cloud for private repositories; signed release provenance remains pending.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testence-${{ github.sha }}-release-evidence
          path: |
            dist/*
            release-artifacts/*
          if-no-files-found: error

  installed-wheel-windows:
    name: Installed wheel / Windows browser
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [quality, tests, minimum-dependencies]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Download and install the exact candidate wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: testence-${{ github.sha }}-candidate-distributions
          path: dist
      - name: Install exact wheel
        shell: pwsh
        run: |
          uv venv .wheel-venv
          $wheel = (Get-ChildItem -LiteralPath dist -Filter *.whl | Select-Object -First 1).FullName
          uv pip install --python .wheel-venv/Scripts/python.exe $wheel
          .wheel-venv/Scripts/python.exe -m playwright install chromium
      - name: Run isolated installed-wheel smoke
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem -LiteralPath dist -Filter *.whl | Select-Object -First 1).FullName
          .wheel-venv/Scripts/python.exe -I scripts/installed_wheel_smoke.py --distribution $wheel --output release-artifacts/installed-wheel-smoke-windows.json
      - name: Save Windows wheel evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testence-${{ github.sha }}-windows-wheel-smoke
          path: |
            release-artifacts/installed-wheel-smoke-windows.json
          if-no-files-found: error

  installed-wheel-macos:
    name: Installed wheel / macOS browser
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [quality, tests, minimum-dependencies]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Download the exact candidate wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: testence-${{ github.sha }}-candidate-distributions
          path: dist
      - name: Install exact wheel
        # macOS needs no --with-deps: the bundled Chromium carries its own frameworks.
        run: |
          uv venv .wheel-venv
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          uv pip install --python .wheel-venv/bin/python "$wheel"
          .wheel-venv/bin/python -m playwright install chromium
      - name: Run isolated installed-wheel smoke
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          .wheel-venv/bin/python -I scripts/installed_wheel_smoke.py --distribution "$wheel" --output release-artifacts/installed-wheel-smoke-macos.json
      - name: Save macOS wheel evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testence-${{ github.sha }}-macos-wheel-smoke
          path: |
            release-artifacts/installed-wheel-smoke-macos.json
          if-no-files-found: error

  visual-clients:
    name: Visual client simulation / ${{ matrix.os }}
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: testence-${{ github.sha }}-candidate-distributions
          path: dist
      - name: Install visual wheel and run isolated clients (Linux)
        if: runner.os == 'Linux'
        run: |
          uv venv .visual-venv
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          uv pip install --python .visual-venv/bin/python "${wheel}[visual]"
          .visual-venv/bin/python -m playwright install --with-deps chromium
          .visual-venv/bin/python -I bench/client_simulation/run.py --distribution "$wheel" --output visual-evidence --repeats 1
      - name: Install visual wheel and run isolated clients (macOS)
        if: runner.os == 'macOS'
        run: |
          uv venv .visual-venv
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          uv pip install --python .visual-venv/bin/python "${wheel}[visual]"
          .visual-venv/bin/python -m playwright install chromium
          .visual-venv/bin/python -I bench/client_simulation/run.py --distribution "$wheel" --output visual-evidence --repeats 1
      - name: Install visual wheel and run isolated clients (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv venv .visual-venv
          $visualWheel = (Get-ChildItem -LiteralPath dist -Filter *.whl | Select-Object -First 1).FullName
          uv pip install --python .visual-venv/Scripts/python.exe "${visualWheel}[visual]"
          .visual-venv/Scripts/python.exe -m playwright install chromium
          .visual-venv/Scripts/python.exe -I bench/client_simulation/run.py --distribution $visualWheel --output visual-evidence --repeats 1
      - name: Retain visual client proof including failed attempts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testence-${{ github.sha }}-visual-${{ matrix.os }}
          path: visual-evidence/
          if-no-files-found: error
