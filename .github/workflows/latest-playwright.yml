name: Latest Playwright

# The lock pins the Playwright the suite is proven with; users install the newest
# release the `<2` range allows. This job finds a breaking minor before they do.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-playwright:
    name: ubuntu-latest / newest Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install dependencies with the newest Playwright
        run: uv sync --extra dev --extra parallel --extra visual --upgrade-package playwright
      - name: Record the resolved Playwright
        run: uv run python -c "import importlib.metadata as m; print('playwright', m.version('playwright'))"
      - name: Install Chromium and system dependencies
        run: uv run playwright install --with-deps chromium
      - name: Run test suite
        run: uv run pytest -q
      - name: Run the documented examples
        run: uv run pytest examples -q --testence-headless
