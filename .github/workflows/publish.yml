name: Publish verified candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full SHA of the candidate already accepted by the release manifest
        required: true
        type: string
      tag:
        description: Existing immutable version tag (for example v1.0.0)
        required: true
        type: string
      candidate_ci_run_id:
        description: CI run that produced the immutable candidate-distributions artifact
        required: true
        type: string
      evidence_run_id:
        description: Protected acceptance run containing every manifest-referenced receipt
        required: true
        type: string
      evidence_artifact_name:
        description: Artifact whose paths recreate the release manifest evidence bundle
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify exact tag, decision, and distribution bytes
    runs-on: ubuntu-latest
    steps:
      - name: Check out release manifest and verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install locked runtime
        run: uv sync --locked
      - name: Download candidate produced by the selected CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: testence-${{ inputs.candidate_sha }}-candidate-distributions
          path: dist
          run-id: ${{ inputs.candidate_ci_run_id }}
          github-token: ${{ github.token }}
      - name: Download protected acceptance evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.evidence_artifact_name }}
          path: acceptance-bundle
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}
      - name: Add versioned release decision evidence
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p "acceptance-bundle/release/evidence/$RELEASE_TAG" acceptance-bundle/corpus acceptance-bundle/bench
          cp "release/evidence/$RELEASE_TAG"/*.json "acceptance-bundle/release/evidence/$RELEASE_TAG/"
          cp -R corpus/. acceptance-bundle/corpus/
          cp -R bench/corpus acceptance-bundle/bench/
          cp -R tests acceptance-bundle/
      - name: Verify the publishing inputs without uploading
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          uv run python scripts/verify_publish_inputs.py \
            --dist-dir dist \
            --build-receipt dist/reproducible-build.json \
            --manifest "release/manifest-$RELEASE_TAG.json" \
            --evidence-root acceptance-bundle \
            --candidate-sha "$CANDIDATE_SHA" \
            --tag "$RELEASE_TAG" \
            --output release-artifacts/publishing-prepared.json
          mkdir publish-dist
          cp dist/*.whl dist/*.tar.gz publish-dist/
      - name: Seal the already verified publication bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testence-${{ inputs.candidate_sha }}-verified-publish-bundle
          path: |
            publish-dist/*
            release-artifacts/publishing-prepared.json
          if-no-files-found: error

  publish:
    name: Publish with trusted OIDC identity
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download the sealed verified bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: testence-${{ inputs.candidate_sha }}-verified-publish-bundle
          path: bundle
      - name: Publish without rebuilding
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: bundle/publish-dist
