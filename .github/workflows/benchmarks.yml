name: Benchmarks

# The replay comparison of README "Benchmarks", on a pinned hosted environment:
# every arm drives the runner's system Chrome, so the browser is the same build for
# Testence, Playwright Test, pytest-playwright, Cypress and SeleniumBase.
on:
  workflow_dispatch:
    inputs:
      repeats:
        description: measured rounds per arm
        default: "30"
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  competitive-replay:
    name: ubuntu-latest / five-arm replay
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REPEATS: ${{ inputs.repeats || '30' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install Testence
        run: uv sync --locked --extra dev
      - name: Install the competitor arms
        run: |
          uv venv .tmp/bench-pytest-playwright --python 3.12
          uv pip install --python .tmp/bench-pytest-playwright/bin/python -r bench/competitive/requirements-pytest-playwright.txt
          uv venv .tmp/bench-seleniumbase --python 3.12
          uv pip install --python .tmp/bench-seleniumbase/bin/python -r bench/competitive/requirements-seleniumbase.txt
          npm ci --prefix bench/node --no-audit --no-fund
          npx --prefix bench/node cypress install
      - name: Record the browser
        run: google-chrome --version
      - name: Run the five-arm replay
        run: |
          uv run python bench/competitive/run.py --repeats "$REPEATS" --channel chrome \
            --output competitive-replay.json
      - name: Save the result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: competitive-replay-${{ github.sha }}
          path: competitive-replay.json
          if-no-files-found: error
