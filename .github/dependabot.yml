version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /bench/sut/app
    schedule:
      interval: weekly
    groups:
      react-sut:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /bench/node
    schedule:
      interval: weekly
    groups:
      benchmark-node:
        patterns: ["*"]
